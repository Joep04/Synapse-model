<!DOCTYPE html>
<html><head><meta charset="utf-8"><script src="../bridge.js"></script></head>
<body><canvas id="c"></canvas>
<script>
const c = document.getElementById('c'), g = c.getContext('2d'), K = PKPD;
// Performance (0-1) comes from model 2 via PKPD.share({ perfUnmedicated, perfMedicated }).
// These fallbacks are used until model 2 provides values.
const FALLBACK = { base: 0.45, med: 0.75 };
const DMAX = 0.6,   // hill/valley height at performance = 1
      TAU = 4,      // decay time of the hills and valleys (s)
      LEN = 1.0,    // sine wavelength (1 = valleys in the middle and at both screen edges)
      SLOPE = 1.2,  // overall downhill slope to the sides: the ball rolls out once the hills have vanished
      FORCE = 1.8,  // gravity: higher = faster rolling back and forth
      DAMP = 0.2,   // friction: lower = swings longer
      NOISE = 0.4,  // shaking strength
      PAUSE = 2, TMAX = 30;

let P = K.params, W = 0, H = 0, last = performance.now(), perf = { ...FALLBACK }, sim = null;
const col = {};
// Sine landscape with amplitude d (decays over time) on top of a symmetric slope down to both sides.
const V  = (x, d) => -d * Math.cos(2 * Math.PI * x / LEN) - SLOPE * x * x / 2;
const dV = (x, d) => d * (2 * Math.PI / LEN) * Math.sin(2 * Math.PI * x / LEN) - SLOPE * x;
const randn = () => Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(2 * Math.PI * Math.random());
const clamp = v => Math.min(1, Math.max(0, +v));
 
// Model 4 (ring attractor) follows this trial: it gets the trial id and the moments the ball is lost
let trialCount = 0;
const shareState = () => K.share({ trial: sim.id, lostUnmedicated: sim.balls[0].lost, lostMedicated: sim.balls[1].lost });
// Score: in each trial the ball that keeps its memory longer wins, the one lost first loses.
// The count resets whenever a slider (or profile) changes.
let score = [{ w: 0, l: 0 }, { w: 0, l: 0 }], lastKey = null;
function newTrial() {
  sim = { id: Date.now() + '-' + (trialCount++), decided: false, t: 0, wait: 0, balls: [perf.base, perf.med].map((p, i) => ({ d0: DMAX * p, x: i ? -0.07 : 0.07, v: 0, lost: null })) };
  shareState();
}
K.onUpdate(p => {
  const key = p.da + '|' + p.mph + '|' + p.profile;
  if (lastKey !== null && key !== lastKey) score = [{ w: 0, l: 0 }, { w: 0, l: 0 }];
  lastKey = key;
  P = p; ['--panel','--ink','--mute','--line','--da','--mph','--sans'].forEach(n => col[n] = K.css(n));
  const s = p.shared || {};
  const nb = clamp(s.perfUnmedicated ?? FALLBACK.base), nm = clamp(s.perfMedicated ?? FALLBACK.med);
  if (!sim || nb !== perf.base || nm !== perf.med) { perf = { base: nb, med: nm }; newTrial(); }
});
c.addEventListener('click', () => newTrial());
 
function fit() {
  const d = devicePixelRatio || 1; W = c.clientWidth; H = c.clientHeight;
  if (c.width !== Math.round(W * d) || c.height !== Math.round(H * d)) { c.width = W * d; c.height = H * d; }
  g.setTransform(d, 0, 0, d, 0, 0);
}
const X = x => W / 2 + x * W / 2;
const Y = v => H * 0.14 + (0.7 - v) / 2.0 * H * 0.76;
 
function step(dt) {
  if (sim.balls.every(b => b.lost !== null) || sim.t > TMAX) { sim.wait += dt; if (sim.wait > PAUSE) newTrial(); return; }
  const n = Math.ceil(dt * 240), h = dt / n; let changed = false;
  for (let i = 0; i < n; i++) {
    sim.t += h;
    sim.balls.forEach(b => {
      if (b.lost !== null) return;
      const d = b.d0 * Math.exp(-sim.t / TAU);
      b.v += (-FORCE * dV(b.x, d) - DAMP * b.v) * h + NOISE * Math.sqrt(h) * randn();
      b.x += b.v * h;
      if (Math.abs(b.x) >= 1) { b.x = Math.sign(b.x); b.v = 0; b.lost = sim.t; changed = true; }   // reached the screen edge: memory lost
    });
  }
  if (changed && !sim.decided) {   // first ball lost decides the trial
    const [u, m] = sim.balls; sim.decided = true;
    const first = u.lost !== null && (m.lost === null || u.lost < m.lost) ? 0 : m.lost !== null && (u.lost === null || m.lost < u.lost) ? 1 : -1;
    if (first >= 0) { score[first].l++; score[1 - first].w++; }
  }
  if (changed) shareState();
}
 
function terrain(d, color, fillA) {
  g.beginPath(); g.moveTo(X(-1), H);
  for (let x = -1; x <= 1.0001; x += 0.01) g.lineTo(X(x), Y(V(x, d)));
  g.lineTo(X(1), H); g.closePath(); g.globalAlpha = fillA; g.fillStyle = color; g.fill();
  g.globalAlpha = 1; g.strokeStyle = color; g.lineWidth = 2.5; g.lineJoin = 'round'; g.beginPath();
  for (let x = -1; x <= 1.0001; x += 0.01) x < -0.999 ? g.moveTo(X(x), Y(V(x, d))) : g.lineTo(X(x), Y(V(x, d)));
  g.stroke();
}
function ball(b, d, color, r, alpha) {
  const px = X(b.x), py = Y(V(b.x, d)) - r * 0.9;
  g.globalAlpha = alpha; g.fillStyle = color; g.beginPath(); g.arc(px, py, r, 0, 7); g.fill();
  g.globalAlpha = .35 * alpha; g.fillStyle = '#fff'; g.beginPath(); g.arc(px - r * .3, py - r * .3, r * .35, 0, 7); g.fill();
  g.globalAlpha = 1;
}
 
function draw() {
  g.clearRect(0, 0, W, H);
  const [u, m] = sim.balls, du = u.d0 * Math.exp(-sim.t / TAU), dm = m.d0 * Math.exp(-sim.t / TAU), r = Math.max(6, H * 0.035);
  terrain(du, col['--mute'], .15); terrain(dm, col['--da'], .15);
  ball(u, du, col['--mute'], r * .9, .9); ball(m, dm, col['--mph'], r, 1);
  g.font = '11px ' + col['--sans']; g.textAlign = 'left';
  [['Unmedicated', col['--mute'], u], ['Medicated', col['--mph'], m]].forEach(([name, color, b], i) => {
    g.fillStyle = color; g.beginPath(); g.arc(14, 14 + i * 16, 4.5, 0, 7); g.fill();
    g.fillStyle = col['--mute']; g.fillText(`${name}  ${score[i].w}W ${score[i].l}L  ·  ${b.lost === null ? 'holding' : 'memory lost at ' + b.lost.toFixed(1) + ' s'}`, 26, 18 + i * 16);
  });
  g.textAlign = 'right'; g.fillText(sim.t.toFixed(1) + ' s', W - 10, 18);
}
 
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; fit();
  if (W && sim && col['--da']) { step(dt * (P.speed || 1)); draw(); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>
