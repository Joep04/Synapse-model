<!DOCTYPE html>
<html><head><meta charset="utf-8"><script src="../bridge.js"></script>
<style>
body{display:flex;flex-direction:column;gap:6px;color:var(--ink);font-family:var(--sans)}
.plots{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.plots div{position:relative;min-width:0;min-height:0}
canvas{position:absolute;inset:0}
</style></head>
<body>
<div class="plots">
  <div><canvas id="c1" role="img" aria-label="Inverted U: performance against dopamine level"></canvas></div>
  <div><canvas id="c2" role="img" aria-label="Performance against methylphenidate concentration"></canvas></div>
</div>
<script>
/**
 * Calculates transporter occupancy and the resulting extracellular dopamine increase 
 * based on a given oral dose of methylphenidate (MPH) and body weight.
 * 
 * @param {number} doseMg - The dose of MPH in milligrams (mg)
 * @param {number} weightKg - Patient body weight in kilograms (default = 70 kg)
 * @returns {Object} An object containing the occupancy percentage and dopamine increase percentage
 */
function calculateDopamineIncrease(doseMg, weightKg = 70) {
    // 1. Calculate ED50 in mg based on body weight (0.25 mg/kg from PET data)
    const ed50Mg = 0.25 * weightKg; 
    const eMax = 0.90; // Maximum possible transporter blockade (90%)
    const n = 1.35;    // Hill coefficient for curve steepness

    if (doseMg <= 0) {
        return { occupancy: 0, daIncrease: 0 };
    }

    // Step A: Calculate the fraction of occupied transporters (O between 0 and 1) using the Hill equation
    const dosePow = Math.pow(doseMg, n);
    const ed50Pow = Math.pow(ed50Mg, n);
    const occupancyFraction = (eMax * dosePow) / (ed50Pow + dosePow);

    // Step B: Calculate dopamine increase based on the open (unoccupied) fraction
    // Reuptake clearance is inversely proportional to the unoccupied fraction (1 - occupancyFraction)
    const dopamineMultiplier = 1 / (1 - occupancyFraction);
    
    // Convert to percentage increase relative to baseline (0% = no change)
    const percentageIncrease = (dopamineMultiplier - 1) * 100;

    return {
        occupancy: occupancyFraction * 100, // Transporter occupancy in %
        daIncrease: percentageIncrease       // Dopamine increase relative to baseline in %
    };
}

const K = PKPD;
// Driven by the sidebar: p.da = baseline dopamine, p.mph = methylphenidate (ng/mL), p.profile = Typical / ADHD / Anxiety.
// The paper-based values (profiles, MPH curve, optimum) live in bridge.js (PKPD.PAPER, PKPD.PROFILES, PKPD.compute).
let P = K.params;

function draw(cv, o) {
  const dpr = devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight; if (!W || !H) return;
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext('2d'); g.scale(dpr, dpr);
  const C = K.css, sans = C('--sans');
  const m = { l: 40, r: 10, t: 26, b: 38 }, pw = W - m.l - m.r, ph = H - m.t - m.b;
  const X = x => m.l + x / o.xmax * pw, Y = y => m.t + ph - y / 100 * ph;
  g.font = '11px ' + sans; g.fillStyle = C('--mute'); g.strokeStyle = C('--line'); g.lineWidth = 1;
  for (let y = 0; y <= 100; y += 25) {
    g.beginPath(); g.moveTo(m.l, Y(y)); g.lineTo(W - m.r, Y(y)); g.stroke();
    g.textAlign = 'right'; g.fillText(y, m.l - 6, Y(y) + 4);
  }
  g.textAlign = 'center';
  for (let x = 0; x <= o.xmax + 1e-9; x += o.xstep) g.fillText(+x.toFixed(2), X(x), H - m.b + 16);
  g.fillText(o.xlabel, m.l + pw / 2, H - 5);
  g.save(); g.translate(11, m.t + ph / 2); g.rotate(-Math.PI / 2); g.fillText('Performance (%)', 0, 0); g.restore();
  g.fillStyle = C('--ink'); g.font = '600 12px ' + sans; g.fillText(o.title, m.l + pw / 2, 14);
  g.beginPath(); g.moveTo(X(o.x[0]), Y(0));
  o.x.forEach((x, i) => g.lineTo(X(x), Y(o.y[i]))); g.lineTo(X(o.x[o.x.length - 1]), Y(0)); g.closePath();
  g.globalAlpha = .09; g.fillStyle = C('--da'); g.fill(); g.globalAlpha = 1;
  
  // Set dash pattern [5, 4] and default grey stroke style
  g.setLineDash([5, 4]); g.strokeStyle = C('--mute'); g.lineWidth = 1.2;
  
  // Unmedicated horizontal line (grey dashed)
  if (o.hline != null) { 
    g.beginPath(); g.moveTo(m.l, Y(o.hline)); g.lineTo(W - m.r, Y(o.hline)); g.stroke(); 
  }
  
  // Medicated horizontal line (purple dashed)
  if (o.hline2 != null) {
    g.save();
    if (o.hline2Color) g.strokeStyle = o.hline2Color;
    g.beginPath(); g.moveTo(m.l, Y(o.hline2)); g.lineTo(W - m.r, Y(o.hline2)); g.stroke();
    g.restore();
  }
  
  if (o.vline != null) { g.beginPath(); g.moveTo(X(o.vline), m.t); g.lineTo(X(o.vline), m.t + ph); g.stroke(); }
  if (o.link) { g.beginPath(); g.moveTo(X(o.link[0].x), Y(o.link[0].y)); g.lineTo(X(o.link[1].x), Y(o.link[1].y)); g.stroke(); }
  
  g.setLineDash([]);
  g.strokeStyle = C('--curve'); g.lineWidth = 2.5; g.lineJoin = 'round'; g.beginPath();
  o.x.forEach((x, i) => i ? g.lineTo(X(x), Y(o.y[i])) : g.moveTo(X(x), Y(o.y[i]))); g.stroke();
  o.markers.forEach(k => {
    g.fillStyle = C('--panel'); g.beginPath(); g.arc(X(k.x), Y(k.y), 8, 0, 7); g.fill();
    g.fillStyle = k.color; g.beginPath(); g.arc(X(k.x), Y(k.y), 5.5, 0, 7); g.fill();
  });
  if (o.legend && pw > 200) {
    g.font = '11px ' + sans; g.textAlign = 'left';
    o.legend.forEach((l, i) => {
      g.fillStyle = l.color; g.beginPath(); g.arc(m.l + 12, m.t + 12 + i * 16, 4.5, 0, 7); g.fill();
      g.fillStyle = C('--mute'); g.fillText(l.label, m.l + 22, m.t + 16 + i * 16);
    });
  }
}

function update() {
  const baseline = P.da, conc = P.mph, s = K.compute(baseline, conc, P.profile), name = (K.PROFILES[P.profile] || { name: 'Custom' }).name;
  const grey = K.css('--mute'), violet = K.css('--mph'), xs = K.linspace(0, K.PAPER.DA_MAX, 200);
  draw(document.getElementById('c1'), {
    x: xs, y: xs.map(x => K.performance(x, s.width)), xmax: K.PAPER.DA_MAX, xstep: 1, title: 'Inverted U', xlabel: 'Dopamine (relative units)',
    hline: s.p0, hline2: s.p1, hline2Color: violet, link: [{ x: s.start, y: s.p0 }, { x: s.after, y: s.p1 }],
    markers: [{ x: s.start, y: s.p0, color: grey }, { x: s.after, y: s.p1, color: violet }],
    legend: [{ label: 'Unmedicated  ' + Math.round(s.p0) + '%', color: grey }, { label: 'Medicated  ' + Math.round(s.p1) + '%', color: violet }]
  });
  const cs = K.linspace(0, 40, 200);
  draw(document.getElementById('c2'), {
    x: cs, y: cs.map(c => K.compute(baseline, c, P.profile).p1), xmax: 40, xstep: 10, title: 'Dose-response: ' + name, xlabel: 'Methylphenidate (ng/mL)',
    hline: s.p0, vline: conc, markers: [{ x: conc, y: s.p1, color: violet }]
  });
  // Output to models 3 and 4 (0-1)
  K.share({ perfUnmedicated: Math.round(s.p0) / 100, perfMedicated: Math.round(s.p1) / 100 });
}

K.onUpdate(p => { P = p; update(); });
</script></body></html>
