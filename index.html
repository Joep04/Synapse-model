<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dopamine & methylphenidate models</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8edee;--panel:#f8faf9;--ink:#12262c;--mute:#5a6e74;--line:#c9d4d6;
  --da:#0b7a75;--mph:#6d3fc0;--curve:#12262c;
  --side:#12262c;--side-ink:#e6f0ef;--side-mute:#8fa5a9;--side-da:#3fc1b8;--side-mph:#a98bff;
  --serif:"Fraunces",Georgia,serif;--sans:"Instrument Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0c1518;--panel:#15252a;--ink:#e6f0ef;--mute:#8fa5a9;--line:#27393d;
  --da:#3fc1b8;--mph:#a98bff;--curve:#e6f0ef;--side:#091014;
}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 var(--sans);background:var(--bg);color:var(--ink);display:grid;grid-template-columns:320px 1fr;height:100vh;overflow:hidden}
aside{position:sticky;top:0;height:100vh;padding:32px 28px;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:30px;overflow:auto}
aside h1{font:600 1.35rem/1.2 var(--serif);margin:0}
aside h1 span{display:block;font:400 .85rem var(--sans);color:var(--side-mute);margin-top:6px}
.cap{font-size:.8rem;color:var(--side-mute);margin-bottom:8px}
.profile{display:flex;flex-wrap:wrap;gap:6px}
.profile button{font:500 .8rem var(--sans);padding:4px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:none;color:var(--side-ink);cursor:pointer}
.profile button[aria-pressed=true]{background:var(--side-da);border-color:var(--side-da);color:var(--side)}
.profile button:focus-visible{outline:2px solid var(--side-da);outline-offset:2px}
.ctl label{display:flex;justify-content:space-between;align-items:baseline;font-weight:500;margin-bottom:10px}
.ctl output{font:600 1.7rem var(--serif);font-variant-numeric:tabular-nums}
.ctl output small{font:400 .8rem var(--sans);color:var(--side-mute);margin-left:4px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:rgba(255,255,255,.18);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--c);border:3px solid var(--side);box-shadow:0 0 0 2px var(--c);cursor:grab}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--c);border:3px solid var(--side);box-shadow:0 0 0 2px var(--c);cursor:grab}
input[type=range]:focus-visible{outline:2px solid var(--c);outline-offset:8px}
#da{--c:var(--side-da)} #mph{--c:var(--side-mph)}
.readout{margin-top:auto;padding-top:22px;border-top:1px solid rgba(255,255,255,.15)}
.readout .lbl{color:var(--side-mute);font-size:.85rem}
.readout .big{font:600 3rem/1.1 var(--serif);font-variant-numeric:tabular-nums}
.readout .big small{font:400 1rem var(--sans);color:var(--side-mute)}
.readout .sub{margin-top:14px;font-size:.95rem}
.readout .sub b{font-family:var(--serif);font-size:1.2rem}
.content{padding:18px 28px 20px;min-width:0;height:100vh;display:flex;flex-direction:column}
nav{display:flex;gap:28px;border-bottom:1px solid var(--line);margin-bottom:16px;flex:none}
nav button{font:500 1rem var(--sans);color:var(--mute);background:none;border:0;padding:4px 0 10px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--da)}
nav button:focus-visible{outline:2px solid var(--da);outline-offset:2px}
#models{position:relative;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:16px;flex:1;min-height:0}
.card{position:relative;background:var(--panel);border-radius:6px;padding:14px 18px 8px;display:flex;flex-direction:column;min-height:0;min-width:0}
.card h2{font:600 1.05rem var(--serif);margin:0 0 2px;padding-right:34px}
.card p{padding-right:34px;margin:0 0 6px;font-size:.8rem;line-height:1.35;color:var(--mute)}
/* info button + popup */
.info{position:absolute;top:12px;right:14px;z-index:2;width:26px;height:26px;padding:0;border-radius:50%;border:1.5px solid var(--mute);background:none;color:var(--mute);font:italic 600 .95rem/1 var(--serif);cursor:pointer;display:grid;place-items:center}
.info:hover,.info[aria-expanded=true]{border-color:var(--da);color:var(--da)}
.info:focus-visible{outline:2px solid var(--da);outline-offset:2px}
.card.open{box-shadow:0 0 0 2px var(--da)}
#popup{position:absolute;top:0;bottom:0;width:calc(50% - 8px);z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 36px rgba(0,0,0,.28);padding:20px 22px;overflow-y:auto}
#popup.right{left:calc(50% + 8px)} #popup.left{left:0}
#popup h2{font:600 1.25rem var(--serif);margin:0 0 10px;padding-right:30px}
#popup p{margin:0 0 1em}
#popup .close{position:absolute;top:8px;right:12px;background:none;border:0;color:var(--mute);font-size:1.5rem;line-height:1;cursor:pointer}
#popup .close:hover{color:var(--ink)}
iframe{width:100%;border:0;display:block;flex:1;min-height:0}
#about{max-width:68ch;overflow-y:auto;flex:1;min-height:0}
#about h2{font:600 1.5rem var(--serif);margin:36px 0 8px}
#about h2:first-child{margin-top:0}
#about p{margin:0 0 1em}
[hidden]{display:none!important}
@media (max-width:860px){
  body{grid-template-columns:1fr;height:auto;overflow:visible}
  aside{position:static;height:auto}
  .readout{margin-top:0}
  .content{padding:20px 16px;height:auto;display:block}
  #models{grid-template-columns:1fr;grid-template-rows:none;gap:16px}
  iframe{flex:none;height:300px}
  #about{overflow:visible}
  #popup,#popup.left,#popup.right{position:fixed;top:auto;bottom:12px;left:12px;right:12px;width:auto;max-height:55vh}
}
</style>
</head>
<body>
<aside>
  <h1>Dopamine & methylphenidate influence on working memory<span>Change the sliders to see what happens to the four models.  <br>
    To get more info on what the models mean, click the "i" symbol in the topright of the model or look at the "About the models" tab.</span></h1>
  <div><div class="cap">Profile (avg values)</div><div class="profile" id="profile"></div></div>
  <div class="ctl"><label for="da">Baseline dopamine <output id="daOut"></output></label>
    <input id="da" type="range" min="0" max="4" step="0.1" value="1"></div>
  <div class="ctl"><label for="mph">Methylphenidate <output id="mphOut"></output></label>
    <input id="mph" type="range" min="0" max="40" step="0.5" value="3"></div>
  </div>
</aside>

<div class="content">
  <nav role="tablist">
    <button role="tab" id="tab-models" aria-selected="true">Models</button>
    <button role="tab" id="tab-about" aria-selected="false">About the models</button>
  </nav>
  <main id="models" role="tabpanel"></main>
  <article id="about" role="tabpanel" hidden></article>
</div>

<script src="content.js"></script>
<script>window.PKPD_HOST = true;</script>
<script src="bridge.js"></script>
<script>
/* ---- Model list: file, card title/caption, and height. The models themselves live in models/*.html ---- */
const MODELS = [
  { file: 'models/model1.html', title: '1. Synapse',                          caption: 'Dopamine released into the cleft; transporters (squares) take it back up (reuptake). Purple = blocked.', height: 340 },
  { file: 'models/model2.html', title: '2. Performance (inverted U)', caption: 'Dopamine and methylphenidate set working memory performance on an inverted U. The effects of this can be seen in models 3 and 4.', height: 270 },
  { file: 'models/model4.html', title: '3. Ring attractor', caption: 'Neurons on a ring hold the memory as a bump of neuron firing. Recurrent excitation decays like the valley in model 4; the bump fades and the memory is lost.', height: 270 },
  { file: 'models/model3.html', title: '4. Valley model', caption: 'Working memory can be seen like a ball in a valley: The valley decays, when the ball rolls out, the memory is lost. Click to restart.', height: 270 }
];

const K = PKPD, params = { da: 1, mph: 3, profile: 'adhd' };
const THEME = ['--panel','--ink','--mute','--line','--da','--mph','--curve','--sans'];
const frames = [], shared = {};

function send(f) {
  const cs = getComputedStyle(document.documentElement), theme = {};
  THEME.forEach(n => theme[n] = cs.getPropertyValue(n).trim());
  f.contentWindow.postMessage({ type: 'pkpd', params: { ...params, shared }, theme }, '*');
}
const sendAll = () => frames.forEach(send);
addEventListener('message', e => {
  const d = e.data; if (!d || d.type !== 'pkpd-share' || !frames.some(f => f.contentWindow === e.source)) return;
  const before = JSON.stringify(shared); Object.assign(shared, d.values);
  if (JSON.stringify(shared) !== before) sendAll();
});

function readouts() {   // sidebar readout is optional: does nothing if the elements were removed
  const r = K.compute(params.da, params.mph, params.profile);
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.innerHTML = v; };
  set('perfOut', `${Math.round(r.p1)}<small>%</small>`);
  set('perf0Out', `${Math.round(r.p0)}%`);
  set('occOut', `${Math.round(r.occupancy * 100)}%`);
}
const paragraphs = t => t.trim().split(/\n\s*\n/).map(p => `<p>${p.trim()}</p>`).join('');

const main = document.getElementById('models'), cards = [], btns = [];
MODELS.forEach(m => {
  const c = document.createElement('section'); c.className = 'card';
  c.innerHTML = `<h2>${m.title}</h2><p>${m.caption}</p><button class="info" aria-label="Info about ${m.title}" aria-expanded="false" title="About this model">i</button><iframe src="${m.file}" title="${m.title}"></iframe>`;
  main.appendChild(c); cards.push(c); btns.push(c.querySelector('.info'));
  const f = c.querySelector('iframe'); frames.push(f);
  f.addEventListener('load', () => send(f));
});

// Info popup: shows this model's text from content.js, over the other column so the model itself stays visible
const popup = document.createElement('div'); popup.id = 'popup'; popup.hidden = true; popup.setAttribute('role', 'dialog');
main.appendChild(popup);
let openIdx = -1;
function closeInfo() {
  if (openIdx < 0) return;
  popup.hidden = true; cards[openIdx].classList.remove('open'); btns[openIdx].setAttribute('aria-expanded', 'false'); openIdx = -1;
}
function openInfo(i) {
  if (openIdx === i) { closeInfo(); return; }
  closeInfo();
  const x = CONTENT.models[i] || { title: MODELS[i].title, text: '' };
  popup.innerHTML = `<button class="close" aria-label="Close">&times;</button><h2>${x.title}</h2>${paragraphs(x.text)}`;
  popup.className = i % 2 === 0 ? 'right' : 'left';
  popup.hidden = false; popup.scrollTop = 0;
  cards[i].classList.add('open'); btns[i].setAttribute('aria-expanded', 'true'); openIdx = i;
  popup.querySelector('.close').addEventListener('click', closeInfo);
}
btns.forEach((b, i) => b.addEventListener('click', () => openInfo(i)));
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeInfo(); });


document.getElementById('about').innerHTML =
  paragraphs(CONTENT.intro) + CONTENT.models.map(x => `<h2>${x.title}</h2>${paragraphs(x.text)}`).join('');

const tabs = [['tab-models', 'models'], ['tab-about', 'about']];
tabs.forEach(([btn, panel]) => document.getElementById(btn).addEventListener('click', () => {
  tabs.forEach(([b, p]) => { document.getElementById(b).setAttribute('aria-selected', b === btn); document.getElementById(p).hidden = p !== panel; });
  closeInfo();
  sendAll();
}));

[['da', 'units', 'daOut', 2], ['mph', 'ng/mL', 'mphOut', 1]].forEach(([id, unit, out, dec]) => {
  const el = document.getElementById(id), o = document.getElementById(out);
  const upd = () => { params[id] = +el.value; o.innerHTML = `${(+el.value).toFixed(dec)}<small>${unit}</small>`; readouts(); sendAll(); };
  el.addEventListener('input', upd); upd();
});
// Profile tabs (Typical / ADHD / Anxiety, from the paper-based model)
const profileBox = document.getElementById('profile');
Object.entries(K.PROFILES).forEach(([key, p]) => {
  const b = document.createElement('button'); b.textContent = p.name; b.dataset.key = key;
  b.setAttribute('aria-pressed', key === params.profile);
  b.addEventListener('click', () => applyProfile(key));
  profileBox.appendChild(b);
});
// A profile moves both sliders to its starting values; you can still adjust them afterwards.
function applyProfile(key) {
  params.profile = key;
  profileBox.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x.dataset.key === key));
  [['da', 'start'], ['mph', 'mph']].forEach(([id, field]) => {
    const el = document.getElementById(id); el.value = K.PROFILES[key][field];
    el.dispatchEvent(new Event('input'));
  });
}
applyProfile(params.profile);
// Deselect the profile when the user moves a slider.
// e.isTrusted is false for the events applyProfile() fires itself, so choosing a tab doesn't deselect it.
['da', 'mph'].forEach(id => document.getElementById(id).addEventListener('input', e => {
  if (!e.isTrusted || params.profile === null) return;
  params.profile = null;
  profileBox.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', 'false'));
  readouts(); sendAll();
}));

if (document.fonts) document.fonts.ready.then(sendAll);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => setTimeout(sendAll, 50));
</script>
</body>
</html>
